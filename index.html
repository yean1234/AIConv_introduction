<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI융합학부 마을</title>
  <meta name="description" content="한동대학교 AI융합학부 전공 소개 — 하치와레 언덕(GE) · 우사기 갈림길(AI융합) · 치이카와 풀밭(DS)에 놀러 오세요.">
  <meta name="theme-color" content="#FFFBF2">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 0) 입장 게이트 (첫 방문) -->
  <div id="gate" class="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate__inner">
      <p class="eyebrow">2026 학부설명회</p>
      <h1 id="gate-title" class="gate__title">AI융합학부 마을에<br>오신 걸 환영해요</h1>
      <div class="gate__friends" id="gate-friends" aria-hidden="true"></div>
      <div class="dialog" id="gate-dialog"></div>
      <div class="ticket">
        <div class="ticket__body">
          <span class="ticket__kicker">손님 방문증</span>
          <b>AI융합학부 마을</b>
          <small>하치와레 언덕 · 우사기 갈림길 · 치이카와 풀밭</small>
        </div>
        <button class="btn btn--solid" type="button" id="gate-enter">마을에 들어가기
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 1) 섬 지도 -->
  <main id="map" class="map">
    <header class="map__head">
      <p class="eyebrow">HANDONG · AI융합학부 마을</p>
      <h1 class="map__title" tabindex="-1">손님, 어디로 가볼까?</h1>
      <p class="map__lead">지도에서 마을을 눌러 놀러 가 보세요. 각 마을 주민이 전공을 소개해 줘요.</p>
    </header>

    <div class="island" id="island">
      <!-- app.js가 지도 SVG와 마을 핀을 채웁니다 -->
    </div>

    <nav class="village-list" id="village-list" aria-label="마을 목록"></nav>
    <p class="map__foot"><button type="button" class="linkish" id="gate-again">입장 인사 다시 보기</button> <a class="linkish" href="lp/">레코드판 버전 보기</a></p>
    <p class="site-note" id="site-note">이 페이지는 2026 AI융합학부 설명회 컨셉에 맞춰 학생이 만든 비공식 페이지로, 학부 공식 페이지가 아닙니다. 캐릭터의 저작권은 ナガノ / ちいかわ에 있으며, 행사 이후 내릴 예정입니다.</p>
  </main>

  <!-- 2) 마을 -->
  <article id="album" class="album" hidden></article>

  <!-- 아이템 카드 (과목 상세) -->
  <aside id="player" class="player" hidden aria-live="polite"></aside>

  <script src="data.js"></script>
  <script src="village.js"></script>
  <script src="app.js"></script>
</body>
</html>
